# AI-written (Cursor cloud agent): keeps GitHub Pages HTTPS enforcement on.
# Outside tokens on the ops box lack `pages` permissions, so this repo-scoped
# GITHUB_TOKEN does the PUT instead. Idempotent; runs on each push to main.
name: enforce-https
on:
  push:
    branches: [main]
permissions:
  pages: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Set https_enforced=true
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/pages
        run: |
          set +e
          echo "=== PUT https_enforced ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" -d '{"https_enforced":true}'
          echo "=== GET final state ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API"
          exit 0
